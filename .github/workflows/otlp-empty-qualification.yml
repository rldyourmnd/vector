name: OTLP empty export qualification

on:
  push:
    branches: [qualification/otlp-empty]
    paths:
      - ci/otlp-empty-probe.py
      - .github/workflows/otlp-empty-qualification.yml
      - src/sources/opentelemetry/**
      - Cargo.toml

permissions:
  contents: read

concurrency:
  group: otlp-empty-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    if: github.repository == 'rldyourmnd/vector' && github.sha == '49d283a1fb1fe45fa7f8fe6c443cceb31b3d980d'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VECTOR_BASE: timberio/vector:0.60.0-debian@sha256:73f0cd0e2c52f5d1f7bad12b1f3f2e9dbb375b469eec8c77fb5ae35c58a8a6d2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reproduce selected image empty request rejection
        shell: bash
        run: |
          set -euo pipefail
          lane="otlp-empty-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker pull "$VECTOR_BASE"
          docker network create --internal "$lane"
          trap 'docker rm -f "$lane"; docker network rm "$lane"' EXIT
          cat > "$RUNNER_TEMP/otlp-empty.yaml" <<'YAML'
          data_dir: /data
          sources:
            otel:
              type: opentelemetry
              decoding:
                codec: otlp
              http:
                address: 0.0.0.0:4318
              grpc:
                address: 0.0.0.0:4317
          sinks:
            discard:
              type: blackhole
              inputs: [otel.traces, otel.logs, otel.metrics]
          YAML
          docker run -d --name "$lane" --network "$lane"             --cpus 1 --memory 512m --pids-limit 128 --read-only --cap-drop ALL             --tmpfs /data:rw,size=16777216 --tmpfs /tmp:rw,size=16777216             --mount "type=bind,src=$RUNNER_TEMP/otlp-empty.yaml,dst=/etc/vector/fixture.yaml,readonly"             "$VECTOR_BASE" --config /etc/vector/fixture.yaml
          address=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$lane")
          python3 -B ci/otlp-empty-probe.py "http://$address:4318" --expect baseline
          docker image inspect "$VECTOR_BASE" --format '{{json .RepoDigests}} {{.Os}}/{{.Architecture}}'

  affected:
    if: github.repository == 'rldyourmnd/vector'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_REF: 80dab0444c0e8e5da00f8eb21d5cd48e49072698
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 80dab0444c0e8e5da00f8eb21d5cd48e49072698
      - name: Bind provider-owned native temporary output
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/otlp-native-target" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          rust: true
          protoc: true
          libsasl2: true
          cargo-nextest: true
          cargo-cache: false
          vdev: true
      - name: Record native source and derive exact component features
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REF"
          git rev-parse HEAD 'HEAD^{tree}' 
          sha256sum Cargo.lock rust-toolchain.toml
          rustc --version --verbose
          cargo --version
          vdev --version
          features=$(vdev features src/sources/opentelemetry/tests/empty-exports.yaml | paste -sd, -)
          test -n "$features"
          echo "FEATURES=$features" >> "$GITHUB_ENV"
          printf 'Derived features: %s\n' "$features"
      - name: Check affected Rust targets through native vdev
        run: make check-clippy FEATURES="$FEATURES"
      - name: Run native OTLP component regressions
        run: make test FEATURES="$FEATURES" SCOPE=opentelemetry
      - name: Verify source and lock inputs stayed immutable
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REF"
          git diff --exit-code -- Cargo.toml Cargo.lock rust-toolchain.toml src/sources/opentelemetry
          sha256sum Cargo.lock rust-toolchain.toml
